name: Script Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: script-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: reviewdog/action-shellcheck@v1
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
          shellcheck_flags: '--external-sources --severity=warning --exclude=SC1090,SC1091'

  shfmt:
    name: Shell Formatting
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Install shfmt
        run: |
          curl -sSfL -o "$RUNNER_TEMP/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          chmod +x "$RUNNER_TEMP/shfmt"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: Check formatting
        run: |
          shfmt --version
          shfmt -d -i 4 .
