name: Script Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: script-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD

      - name: Run ShellCheck
        run: |
          shellcheck --version
          findings="$RUNNER_TEMP/shellcheck.txt"
          rc=0
          git ls-files -z '*.sh' |
            xargs -0 shellcheck --external-sources --severity=warning \
              --exclude=SC1090,SC1091 --format=gcc >"$findings" || rc=$?

          if [ -s "$findings" ]; then
            awk -F: '
                NF >= 5 && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ {
                    file = $1; line = $2; col = $3
                    rest = $0
                    sub(/^[^:]+:[0-9]+:[0-9]+: /, "", rest)
                    sev = rest; sub(/:.*/, "", sev)
                    msg = rest; sub(/^[a-z]+: /, "", msg)
                    title = "shellcheck"
                    if (match(msg, /\[SC[0-9]+\]$/)) {
                        title = substr(msg, RSTART + 1, RLENGTH - 2)
                        msg = substr(msg, 1, RSTART - 2)
                    }
                    lvl = (sev == "error") ? "error" : (sev == "warning") ? "warning" : "notice"
                    gsub(/%/, "%25", msg)
                    printf "::%s file=%s,line=%s,col=%s,title=%s::%s\n", lvl, file, line, col, title, msg
                }
            ' "$findings"
            printf '\n--- full shellcheck output ---\n'
            cat "$findings"
          fi

          exit "$rc"

  shfmt:
    name: Shell Formatting
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - name: Checkout sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD

      - name: Install shfmt
        run: |
          curl -sSfL -o "$RUNNER_TEMP/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          chmod +x "$RUNNER_TEMP/shfmt"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: Check formatting
        run: |
          shfmt --version
          unformatted="$RUNNER_TEMP/unformatted.txt"
          shfmt -l -i 4 . >"$unformatted"

          if [ -s "$unformatted" ]; then
            while IFS= read -r f; do
              printf '::error file=%s,title=shfmt::Not formatted. Run: shfmt -w -i 4 %s\n' "$f" "$f"
            done <"$unformatted"
            printf '\n--- diff ---\n'
            shfmt -d -i 4 .
            exit 1
          fi

          echo "All shell files are formatted."
