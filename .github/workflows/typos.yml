name: Check for typos

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD

      - name: Install typos
        run: |
          curl -sSfL -o "$RUNNER_TEMP/typos.tar.gz" \
            https://github.com/crate-ci/typos/releases/download/v1.50.2/typos-v1.50.2-x86_64-unknown-linux-musl.tar.gz
          tar -xzf "$RUNNER_TEMP/typos.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      - name: Run spellcheck
        run: |
          typos --version
          findings="$RUNNER_TEMP/typos.json"
          rc=0
          typos --format json >"$findings" || rc=$?

          if [ -s "$findings" ]; then
            jq -r 'select(.type == "typo") |
              "::error file=\(.path),line=\(.line_num),col=\(.byte_offset + 1),title=typo::`\(.typo)` should be \(.corrections | join(", "))"' \
              "$findings"
            printf '\n--- full typos output ---\n'
            typos || true
          fi

          exit "$rc"
